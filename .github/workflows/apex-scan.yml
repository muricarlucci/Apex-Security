name: Apex Scan Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pytest
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        flake8 . --count --select E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Format with black
      run: black --check .
    - name: Sort with isort
      run: isort --check-only .
    - name: Run Apex Security Scan
      env:
        GITHUB_REPO_NAME: ${{ github.repository_name }}
        GITHUB_OWNER_NAME: ${{ github.repository_owner }}
      run: |
        echo "Running Apex Security Scan..."
        echo "Repository Name: $GITHUB_REPO_NAME"
        echo "Repository Owner: $GITHUB_OWNER_NAME"
        # Simula a execução de um comando que usa as variáveis de ambiente
        python -c "import os; print(f'Repo: {os.environ.get(\'GITHUB_REPO_NAME\')}, Owner: {os.environ.get(\'GITHUB_OWNER_NAME\')}')"
    - name: Upload scan results
      uses: actions/upload-artifact@v3
      with:
        name: apex-scan-results
        path: scan_results.json
