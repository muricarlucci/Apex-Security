name: Apex Security Scan

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  apex-security-scan:
    name: Run Security Scanners
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    env:
      APEX_API_URL: ${{ secrets.APEX_API_URL }}
      APEX_USER_API_KEY: ${{ secrets.APEX_USER_API_KEY }}
      SCAN_REPOSITORY: ${{ github.repository }}
      SCAN_BRANCH: ${{ github.ref_name }}
      SCAN_COMMIT: ${{ github.sha }}

    steps:
      - name: Validate Apex integration configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          if [ -z "$APEX_API_URL" ] || [ -z "$APEX_USER_API_KEY" ]; then
            echo "::error::Configure APEX_API_URL and APEX_USER_API_KEY in GitHub Actions repository secrets."
            exit 1
          fi
          case "$APEX_API_URL" in
            https://*) ;;
            *) echo "::error::APEX_API_URL must use HTTPS."; exit 1 ;;
          esac
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan
        id: semgrep
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=semgrep-results.json \
            --no-error \
            .
          echo "semgrep_done=true" >> $GITHUB_OUTPUT

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run Trivy IaC scan
        id: trivy
        run: |
          trivy fs \
            --format json \
            --output trivy-results.json \
            --scanners vuln,misconfig \
            --exit-code 0 \
            .
          echo "trivy_done=true" >> $GITHUB_OUTPUT

      - name: Send Semgrep results to Apex API
        if: always() && !cancelled() && steps.semgrep.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: |
          if [ ! -s semgrep-results.json ]; then
            echo "::error::Scanner output is missing or empty."
            exit 1
          fi
          if [ -s semgrep-results.json ]; then
            PAYLOAD=$(jq -n \
              --arg tool "semgrep" \
              --arg repo "$SCAN_REPOSITORY" \
              --arg branch "$SCAN_BRANCH" \
              --arg sha "$SCAN_COMMIT" \
              --rawfile raw semgrep-results.json \
              '{tool: $tool, repository: $repo, branch: $branch, commit_sha: $sha, raw_json: $raw}')
            printf '%s' "$PAYLOAD" > /tmp/apex-payload.json
            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
              "${APEX_API_URL%/}/api/scan" \
              -H "Content-Type: application/json" \
              -H "X-Apex-Api-Key: ${APEX_USER_API_KEY}" \
              --data-binary @/tmp/apex-payload.json \
              --connect-timeout 15 --max-time 120)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Scan enviado com sucesso (HTTP $HTTP_CODE)"
            else
              echo "❌ Falha ao enviar scan — HTTP $HTTP_CODE"
              cat /tmp/response.json
              exit 1
            fi
          fi

      - name: Send Trivy results to Apex API
        if: always() && !cancelled() && steps.trivy.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: |
          if [ ! -s trivy-results.json ]; then
            echo "::error::Scanner output is missing or empty."
            exit 1
          fi
          if [ -s trivy-results.json ]; then
            PAYLOAD=$(jq -n \
              --arg tool "trivy" \
              --arg repo "$SCAN_REPOSITORY" \
              --arg branch "$SCAN_BRANCH" \
              --arg sha "$SCAN_COMMIT" \
              --rawfile raw trivy-results.json \
              '{tool: $tool, repository: $repo, branch: $branch, commit_sha: $sha, raw_json: $raw}')
            printf '%s' "$PAYLOAD" > /tmp/apex-payload.json
            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
              "${APEX_API_URL%/}/api/scan" \
              -H "Content-Type: application/json" \
              -H "X-Apex-Api-Key: ${APEX_USER_API_KEY}" \
              --data-binary @/tmp/apex-payload.json \
              --connect-timeout 15 --max-time 120)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Scan enviado com sucesso (HTTP $HTTP_CODE)"
            else
              echo "❌ Falha ao enviar scan — HTTP $HTTP_CODE"
              cat /tmp/response.json
              exit 1
            fi
          fi

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-scan-results-${{ github.sha }}
          path: |
            semgrep-results.json
            trivy-results.json
          retention-days: 30
