services:
  - type: web
    name: apex-security-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL_TO
        value: apexsecurityofficial@gmail.com
      - key: RESEND_FROM_ADDRESS
        value: Apex Security <onboarding@resend.dev>
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: muricarlucci/Apex-Security
      - key: FRONTEND_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
